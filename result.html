<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>战斗结算 · 沙盘战争</title>
  <link rel="stylesheet" href="./members/css/battlepages.css">
  <style>
   
    /* 胜负大字：胜利暗红 / 失败军绿，加大醒目 */
    .battle-hero h1#resultVerdict {
      font-size: 3.4rem;
      letter-spacing: 10px;
      color: var(--dark-red);
      text-shadow:
        0 1px 0 rgba(255, 255, 255, 0.65),
        0 3px 16px rgba(40, 25, 12, 0.3);
    }
    .battle-hero h1#resultVerdict.lose {
      color: var(--military-green);
    }
    .battle-hero .hero-eyebrow.lose { color: var(--military-green); }

    /* 原因标题（h2）：失败态换军绿 */
    .bbg-section h2.lose {
      color: var(--military-green-deep);
      border-left-color: var(--military-green);
    }

    /* 原因框：文字多时内部滚动，不把整页撑爆 */
    .result-reason {
      max-height: 40vh;
      overflow-y: auto;
      overflow-x: hidden;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }
    .result-reason::-webkit-scrollbar { width: 6px; }
    .result-reason::-webkit-scrollbar-track { background: transparent; }
    .result-reason::-webkit-scrollbar-thumb {
      background: var(--wood-mid);
      border-radius: 3px;
    }

    /* 用时 */
    .result-meta {
      margin-top: 14px;
      text-align: right;
      color: var(--text-muted);
      font-size: 0.8rem;
      letter-spacing: 2px;
      min-height: 18px;
    }

    /* 按钮组 */
    .bbg-start {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }
    /* 次级按钮（返回主界面）：军绿做旧，与主按钮暗红区分 */
    .result-btn-secondary {
      background: linear-gradient(180deg, var(--military-green) 0%, var(--military-green-deep) 100%);
    }

    @media (max-width: 480px) {
      .battle-hero h1#resultVerdict { font-size: 2.4rem; letter-spacing: 6px; }
    }
  </style>
</head>
<body>

  <!-- ==================== 顶部导航条（同 battlebackground） ==================== -->
  <nav class="battle-nav">
    <div class="battle-nav-inner">
      <a class="battle-nav-back" href="./battlechoose.html">&larr; 返回关卡</a>
      <a class="battle-nav-brand" href="./index.html">
        <span class="nav-mark">&#9876;</span> 沙盘战争
      </a>
    </div>
  </nav>

  <!-- ==================== 标题区：胜负大字（同 battle-hero 结构） ==================== -->
  <section class="battle-hero">
    <span class="hero-eyebrow" id="resultEyebrow">VICTORY</span>
    <h1 id="resultVerdict">胜利</h1>
    <p class="hero-subtitle" id="resultSubtitle"></p>
  </section>

  <!-- ==================== 内容区（同 bbg-shell） ==================== -->
  <div class="bbg-shell">

    <section class="bbg-section">
      <h2 id="panelLabel">作战胜利原因</h2>
      <div class="bbg-text result-reason" id="resultReason"></div>
      <p class="result-meta" id="resultTime"></p>
    </section>

    <!-- ==================== 按钮（同 bbg-start） ==================== -->
    <div class="bbg-start">
      <a class="battle-btn" id="resultPrimary" href="./battlechoose.html">重新开始</a>
      <a class="battle-btn result-btn-secondary" id="resultHome" href="./index.html">返回主界面</a>
    </div>

  </div>

  <script>
    /* =========================================================
       结算数据字典：新增结算类型在这里加一条。
       原因支持多行：字符串里用 \n 换行即可。
       URL 参数：?result=victory|defeat&level=<id>&reason=<可选>&t=<用时>
       ========================================================= */
    var RESULT_DATA = {
      victory: {
        verdict: '胜利',
        eyebrow: 'VICTORY',
        label: '作战胜利原因',
        reason: '敌军有生力量已被全歼。\n战役目标达成，前线转入新的攻势阶段。'
      },
      defeat: {
        verdict: '失败',
        eyebrow: 'DEFEAT',
        label: '作战失败原因',
        reason: '我方基地失守。\n部队已失去作战能力，本场战役未能达成目标。'
      }
    };

    (function () {
      var params = new URLSearchParams(window.location.search);
      var result = params.get('result') === 'victory' ? 'victory' : 'defeat';
      var levelId = (params.get('level') || '').trim();
      var reason = (params.get('reason') || '').trim();
      var timeText = (params.get('t') || '').trim();

      var data = RESULT_DATA[result];
      var isDefeat = result === 'defeat';

      /* 基础填充 */
      document.title = data.verdict + ' · 沙盘战争';
      var verdictEl = document.getElementById('resultVerdict');
      var eyebrowEl = document.getElementById('resultEyebrow');
      var labelEl = document.getElementById('panelLabel');
      verdictEl.textContent = data.verdict;
      eyebrowEl.textContent = data.eyebrow;
      verdictEl.classList.toggle('lose', isDefeat);
      eyebrowEl.classList.toggle('lose', isDefeat);
      labelEl.textContent = data.label;
      labelEl.classList.toggle('lose', isDefeat);

      document.getElementById('resultReason').textContent = reason || data.reason;
      if (timeText) document.getElementById('resultTime').textContent = '用时 ' + timeText;

      var primary = document.getElementById('resultPrimary');
      var subtitleEl = document.getElementById('resultSubtitle');

      /* 关卡索引：取战役名（副标题）+ 计算下一战场（与游戏内「下一关」逻辑同源） */
      fetch('/assets/levels/index.json')
        .then(function (res) { return res.ok ? res.json() : null; })
        .then(function (index) {
          var levels = (index && index.levels) ? index.levels : [];
          var current = levels.findIndex(function (l) { return l.id === levelId; });

          if (current >= 0) {
            document.title = data.verdict + ' · ' + levels[current].name;
            subtitleEl.textContent = levels[current].name + (timeText ? ' · 用时 ' + timeText : '');
          } else if (timeText) {
            subtitleEl.textContent = '用时 ' + timeText;
          }

          if (result === 'victory') {
            var next = current >= 0 ? levels[current + 1] : null;
            if (next) {
              primary.textContent = '下一战场';
              primary.setAttribute('href', './game.html?level=' + encodeURIComponent(next.id));
            } else {
              primary.textContent = '返回战役选择';
              primary.setAttribute('href', './battlechoose.html');
            }
          } else {
            primary.textContent = '重新开始';
            primary.setAttribute('href',
              levelId ? './game.html?level=' + encodeURIComponent(levelId) : './battlechoose.html');
          }
        })
        .catch(function () {
          if (timeText) subtitleEl.textContent = '用时 ' + timeText;
          if (result === 'victory') {
            primary.textContent = '返回战役选择';
            primary.setAttribute('href', './battlechoose.html');
          } else if (levelId) {
            primary.setAttribute('href', './game.html?level=' + encodeURIComponent(levelId));
          }
        });
    })();
  </script>

  <script src="/audio.js"></script>
  <script>
    // UI 音效：导航返回 / 按钮
    window.bindSfx({
      '.battle-nav a': 'click',
      '.bbg-start .battle-btn': 'button'
    });
  </script>
</body>
</html>
