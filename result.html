<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>战斗结算 · 沙盘战争</title>
  <link rel="stylesheet" href="./members/css/battlepages.css">
  <style>
    /* ★ 从 result-video.html 跳转而来时：黑→暖米黄→透明 + 内容微弹入（更丝滑） */
    /* 全屏蒙版伪元素：默认隐藏；接续模式下用两段关键帧播放：
       0~0.25s  从黑渐变到暖米黄做旧底（消除视频黑→结算页底色的硬切）
       0.25s~1.1s 暖米黄做旧底 渐变到透明（结算页元素"从底色里浮出来"）
       蒙版的颜色和径向光晕与 battlepages.css body 背景完全一致，过渡完成后不会"切色" */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-color: #000;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
    }
    body.video-continuation::before {
      animation:
        mask-warm-up .28s cubic-bezier(.4, 0, .2, 1) forwards,
        mask-fade-out .82s cubic-bezier(.4, 0, .2, 1) .28s forwards;
    }
    @keyframes mask-warm-up {
      from { background-color: #000; }
      to   { background-color: var(--cream-deep, #D9CFBC); }
    }
    @keyframes mask-fade-out {
      from {
        opacity: 1;
        background-color: var(--cream-deep, #D9CFBC);
        background-image:
          radial-gradient(circle at 30% 20%, rgba(255, 248, 230, 0.6) 0%, transparent 60%),
          radial-gradient(circle at 80% 90%, rgba(180, 140, 90, 0.18) 0%, transparent 55%);
      }
      to {
        opacity: 0;
        background-color: var(--cream-deep, #D9CFBC);
        background-image:
          radial-gradient(circle at 30% 20%, rgba(255, 248, 230, 0.6) 0%, transparent 60%),
          radial-gradient(circle at 80% 90%, rgba(180, 140, 90, 0.18) 0%, transparent 55%);
      }
    }

    /* 接续模式：内容层（nav / hero / shell）初始 = 蒙版之上、轻微下移 + 透明 + 缩放 */
    body.video-continuation .battle-nav,
    body.video-continuation .battle-hero,
    body.video-continuation .bbg-shell {
      opacity: 0;
      transform: translateY(22px) scale(.97);
      filter: blur(4px);
      transition:
        opacity .9s cubic-bezier(.2, 1.05, .35, 1),
        transform .9s cubic-bezier(.2, 1.05, .35, 1),
        filter .9s cubic-bezier(.2, 1.05, .35, 1);
    }
    body.video-continuation.revealed .battle-nav,
    body.video-continuation.revealed .battle-hero,
    body.video-continuation.revealed .bbg-shell {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0);
    }
    /* 错开：nav 0.55s，hero 0.72s，shell 0.92s（带轻微回弹的弹入） */
    body.video-continuation.revealed .battle-nav  { transition-delay: .55s; }
    body.video-continuation.revealed .battle-hero { transition-delay: .72s; }
    body.video-continuation.revealed .bbg-shell   { transition-delay: .92s; }

    /* 接续模式：页面底色先用暖米黄做旧底（避免与 battlepages.css body 叠加导致"切色"） */
    body.video-continuation {
      background-color: var(--cream-deep, #D9CFBC) !important;
      background-image:
        radial-gradient(circle at 30% 20%, rgba(255, 248, 230, 0.6) 0%, transparent 60%),
        radial-gradient(circle at 80% 90%, rgba(180, 140, 90, 0.18) 0%, transparent 55%) !important;
    }
  </style>
  <style>
   
    /* 胜负大字：胜利暗红 / 失败军绿，加大醒目 */
    .battle-hero h1#resultVerdict {
      font-size: 3.4rem;
      letter-spacing: 10px;
      color: var(--dark-red);
      text-shadow:
        0 1px 0 rgba(255, 255, 255, 0.65),
        0 3px 16px rgba(40, 25, 12, 0.3);
    }
    .battle-hero h1#resultVerdict.lose {
      color: var(--military-green);
    }
    .battle-hero .hero-eyebrow.lose { color: var(--military-green); }

    /* 原因标题（h2）：失败态换军绿 */
    .bbg-section h2.lose {
      color: var(--military-green-deep);
      border-left-color: var(--military-green);
    }

    /* 原因框：文字多时内部滚动，不把整页撑爆 */
    .result-reason {
      max-height: 40vh;
      overflow-y: auto;
      overflow-x: hidden;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }
    .result-reason::-webkit-scrollbar { width: 6px; }
    .result-reason::-webkit-scrollbar-track { background: transparent; }
    .result-reason::-webkit-scrollbar-thumb {
      background: var(--wood-mid);
      border-radius: 3px;
    }

    /* 用时 */
    .result-meta {
      margin-top: 14px;
      text-align: right;
      color: var(--text-muted);
      font-size: 0.8rem;
      letter-spacing: 2px;
      min-height: 18px;
    }

    /* 伤亡统计（URL 参数带入）：两张对阵卡片 + 一行战损比 */
    .casualty-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 6px;
    }
    .casualty-card {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 14px 18px;
      background: var(--paper-warm);
      border: 1px solid var(--wood-mid);
      border-left-width: 5px;
      box-shadow: var(--shadow-sm);
    }
    .casualty-card.own { border-left-color: var(--military-green); }
    .casualty-card.enemy { border-left-color: var(--dark-red); }
    .casualty-name {
      font-size: 0.76rem;
      letter-spacing: 2px;
      color: var(--text-muted);
    }
    .casualty-value {
      font-size: 1.9rem;
      line-height: 1.1;
      color: var(--dark-red-deep);
      font-variant-numeric: tabular-nums;
    }
    .casualty-card.own .casualty-value { color: var(--military-green-deep); }
    .casualty-ratio {
      margin-top: 12px;
      text-align: right;
      color: var(--text-mid);
      font-size: 0.82rem;
      letter-spacing: 2px;
      min-height: 18px;
    }
    .casualty-note {
      margin-top: 8px;
      color: var(--text-muted);
      font-size: 0.74rem;
      letter-spacing: 1px;
      line-height: 1.6;
    }
    @media (max-width: 480px) {
      .casualty-grid { grid-template-columns: 1fr; }
    }

    /* 按钮组 */
    .bbg-start {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }
    /* 次级按钮（返回主界面）：军绿做旧，与主按钮暗红区分 */
    .result-btn-secondary {
      background: linear-gradient(180deg, var(--military-green) 0%, var(--military-green-deep) 100%);
    }

    @media (max-width: 480px) {
      .battle-hero h1#resultVerdict { font-size: 2.4rem; letter-spacing: 6px; }
    }
  </style>
</head>
<body>
  <script>
    /* 未登录守卫：本页是 classic script 页面（不能 import /src/auth.js），
       这里做与 src/auth.js 的 requireAuth() 同一套判断：没有会话 → 跳登录页并带 next。
       放在最前面，避免先渲染再被弹走。 */
    (function () {
      try {
        var session = JSON.parse(localStorage.getItem('war-of-dots.session') || 'null');
        if (session && session.username) return;
        var next = window.location.pathname + window.location.search + window.location.hash;
        window.location.replace('/login.html?next=' + encodeURIComponent(next));
      } catch (e) {
        window.location.replace('/login.html');
      }
    })();
  </script>

  <!-- ==================== 顶部导航条（同 battlebackground） ==================== -->
  <nav class="battle-nav">
    <div class="battle-nav-inner">
      <a class="battle-nav-back" href="./battlechoose.html">&larr; 返回关卡</a>
      <a class="battle-nav-brand" href="./index.html">
        <span class="nav-mark">&#9876;</span> 沙盘战争
      </a>
    </div>
  </nav>

  <!-- ==================== 标题区：胜负大字（同 battle-hero 结构） ==================== -->
  <section class="battle-hero">
    <span class="hero-eyebrow" id="resultEyebrow">VICTORY</span>
    <h1 id="resultVerdict">胜利</h1>
    <p class="hero-subtitle" id="resultSubtitle"></p>
  </section>

  <!-- ==================== 内容区（同 bbg-shell） ==================== -->
  <div class="bbg-shell">

    <section class="bbg-section">
      <h2 id="panelLabel">作战胜利原因</h2>
      <div class="bbg-text result-reason" id="resultReason"></div>
      <p class="result-meta" id="resultTime"></p>
    </section>

    <!-- ==================== 双方伤亡（URL 参数带入，缺参数时整块隐藏） ==================== -->
    <section class="bbg-section" id="casualtyPanel" hidden>
      <h2 id="casualtyLabel">双方伤亡</h2>
      <div class="casualty-grid">
        <div class="casualty-card own">
          <span class="casualty-name">我方 · 蓝军</span>
          <strong class="casualty-value" id="casualtyOwn">0</strong>
        </div>
        <div class="casualty-card enemy">
          <span class="casualty-name">敌军 · 红军</span>
          <strong class="casualty-value" id="casualtyEnemy">0</strong>
        </div>
      </div>
      <p class="casualty-ratio" id="casualtyRatio"></p>
    </section>

    <!-- ==================== 按钮（同 bbg-start） ==================== -->
    <div class="bbg-start">
      <a class="battle-btn" id="resultPrimary" href="./battlechoose.html">重新开始</a>
      <a class="battle-btn result-btn-secondary" id="resultHome" href="./battlechoose.html">返回主界面</a>
    </div>

  </div>

  <!-- 按账号隔离的本地存储（classic script 版；与 src/user-storage.js 同逻辑） -->
  <script src="/user-storage.js"></script>
  <script>
    // 进度类数据统一走按账号隔离的存储层（键 = war-of-dots.u.<账号>.<数据名>）
    var store = window.UserStorage;

    /* =========================================================
       结算数据字典：新增结算类型在这里加一条。
       原因支持多行：字符串里用 \n 换行即可。
       URL 参数：?result=victory|defeat&level=<id>&reason=<可选>&t=<用时>
                 &casualtiesBlue=<我方伤亡>&casualtiesRed=<敌军伤亡>
       （伤亡 = 损失的血量，1 点血 = 1 点伤亡；缺这两个参数时伤亡整块不显示）
       ========================================================= */
    var RESULT_DATA = {
      victory: {
        verdict: '胜利',
        eyebrow: 'VICTORY',
        label: '作战胜利原因',
        reason: '敌军有生力量已被全歼。\n战役目标达成，前线转入新的攻势阶段。'
      },
      defeat: {
        verdict: '失败',
        eyebrow: 'DEFEAT',
        label: '作战失败原因',
        reason: '我方基地失守。\n部队已失去作战能力，本场战役未能达成目标。'
      }
    };

    /* 结局关卡：打完这一关就算全战役通关，主按钮不再是"下一战场"，而是"进入结局"。
       关卡 id 与 public/assets/levels/index.json 里的 id 必须一致（单测守着这条）。 */
    var ENDING_LEVEL = 'dujiang_battle';

    (function () {
      var params = new URLSearchParams(window.location.search);
      var result = params.get('result') === 'victory' ? 'victory' : 'defeat';
      var levelId = (params.get('level') || '').trim();
      var reason = (params.get('reason') || '').trim();
      var timeText = (params.get('t') || '').trim();

      var data = RESULT_DATA[result];
      var isDefeat = result === 'defeat';

      /* 基础填充 */
      document.title = data.verdict + ' · 沙盘战争';
      var verdictEl = document.getElementById('resultVerdict');
      var eyebrowEl = document.getElementById('resultEyebrow');
      var labelEl = document.getElementById('panelLabel');
      verdictEl.textContent = data.verdict;
      eyebrowEl.textContent = data.eyebrow;
      verdictEl.classList.toggle('lose', isDefeat);
      eyebrowEl.classList.toggle('lose', isDefeat);
      labelEl.textContent = data.label;
      labelEl.classList.toggle('lose', isDefeat);

      document.getElementById('resultReason').textContent = reason || data.reason;
      if (timeText) document.getElementById('resultTime').textContent = '用时 ' + timeText;

      /* =========================================================
         战绩入库（成就页读取）：war-of-dots.level-stats
         { <levelId>: { cleared, bestTime, bestCasualties, plays } }
         - cleared 只在胜利时置位；bestTime 取最快的通关用时（秒）；bestCasualties 取最低的我方伤亡
         - 存不下（隐私模式/配额满）就算了，不影响结算页本身
         ========================================================= */
      function timeToSeconds(text) {
        var m = /^(\d+):(\d{2})$/.exec(text || '');
        return m ? Number(m[1]) * 60 + Number(m[2]) : null;
      }
      if (levelId) {
        try {
          var all = store.readJSON('level-stats', {}) || {};
          var entry = all[levelId] || {};
          var seconds = timeToSeconds(timeText);
          var ownLoss = params.has('casualtiesBlue')
            ? Math.max(0, Math.round(Number(params.get('casualtiesBlue')) || 0))
            : null;
          entry.plays = (entry.plays || 0) + 1;
          if (result === 'victory') {
            entry.cleared = true;
            if (seconds != null && (entry.bestTime == null || seconds < entry.bestTime)) entry.bestTime = seconds;
            if (ownLoss != null && (entry.bestCasualties == null || ownLoss < entry.bestCasualties)) {
              entry.bestCasualties = ownLoss;
            }
          }
          all[levelId] = entry;
          store.writeJSON('level-stats', all);
        } catch (e) { /* 本地存储不可用时忽略 */ }
      }

      // 失败标记（用于"胜败乃兵家常事"成就）
      if (result === 'defeat') {
        try { store.writeFlag('has-defeat'); } catch (e) {}
      }

      /* =========================================================
         成就判定与弹窗：战绩入库后检测新解锁的成就，逐个弹出
         ========================================================= */
      function showAchievementPopup(ach) {
        var el = document.getElementById('achPopup');
        if (!el) {
          el = document.createElement('div');
          el.id = 'achPopup';
          el.style.cssText = 'position:fixed;top:24px;right:24px;z-index:99999;background:linear-gradient(135deg,#2a1810,#4a2818);border:2px solid #d4a843;border-radius:10px;padding:14px 20px;min-width:260px;box-shadow:0 8px 32px rgba(0,0,0,.6);font-family:"PingFang SC","Microsoft YaHei",sans-serif;transform:translateX(120%);transition:transform .4s ease;pointer-events:none;';
          el.innerHTML = '<div style="font-size:11px;color:#d4a843;letter-spacing:2px;margin-bottom:4px;">成就解锁</div>' +
            '<div style="display:flex;align-items:center;gap:8px;">' +
            '<span id="achPopupStars" style="color:#ffd700;font-size:16px;"></span>' +
            '<span id="achPopupName" style="color:#fff;font-size:16px;font-weight:bold;"></span>' +
            '</div>' +
            '<div id="achPopupDesc" style="color:#c8b89a;font-size:12px;margin-top:4px;line-height:1.5;"></div>';
          document.body.appendChild(el);
        }
        document.getElementById('achPopupStars').textContent = '★'.repeat(ach.stars) + '☆'.repeat(3 - ach.stars);
        document.getElementById('achPopupName').textContent = ach.name;
        document.getElementById('achPopupDesc').textContent = ach.desc;
        el.style.transform = 'translateX(0)';
        try { window.playSfx?.('win'); } catch (e) {}
        clearTimeout(el._timer);
        el._timer = setTimeout(function() { el.style.transform = 'translateX(120%)'; }, 3500);
      }
      function checkNewAchievements() {
        import('/src/achievements.js').then(function(mod) {
          // 全部进度类数据都走账号命名空间（store = window.UserStorage，见脚本顶部）
          var prevUnlocked = store.readJSON('ach-unlocked', {}) || {};
          var list = mod.evaluateAchievements({
            progress: store.readJSON('campaign-progress', {}),
            stats: store.readJSON('level-stats', {}),
            levels: [],
            climbCleared: store.readFlag('climb-cleared'),
            climbStats: store.readJSON('climb-stats', null),
            customMapSaved: Boolean(store.readJSON('custom-map', null)),
            hasDefeat: store.readFlag('has-defeat'),
          });
          var newAchs = list.filter(function(a) { return a.unlocked && !prevUnlocked[a.id]; });
          if (newAchs.length > 0) {
            var unlocked = Object.assign({}, prevUnlocked);
            newAchs.forEach(function(a) { unlocked[a.id] = true; });
            store.writeJSON('ach-unlocked', unlocked);
            newAchs.forEach(function(a, i) {
              setTimeout(function() { showAchievementPopup(a); }, i * 3800 + 800);
            });
          }
        }).catch(function(e) { console.error('成就判定失败:', e); });
      }
      setTimeout(checkNewAchievements, 1200);

      /* =========================================================
         双方伤亡：URL 参数 casualtiesBlue / casualtiesRed
         （1 点损失的血量 = 1 点伤亡，由模拟层 World.damageUnit 累计）。
         老链接 / 直接打开没有这两个参数时，整块不显示。
         ========================================================= */
      var hasCasualties = params.has('casualtiesBlue') || params.has('casualtiesRed');
      if (hasCasualties) {
        var ownLoss = Math.max(0, Math.round(Number(params.get('casualtiesBlue')) || 0));
        var enemyLoss = Math.max(0, Math.round(Number(params.get('casualtiesRed')) || 0));
        document.getElementById('casualtyPanel').hidden = false;
        document.getElementById('casualtyLabel').classList.toggle('lose', isDefeat);
        document.getElementById('casualtyOwn').textContent = String(ownLoss);
        document.getElementById('casualtyEnemy').textContent = String(enemyLoss);
        var ratioEl = document.getElementById('casualtyRatio');
        if (ownLoss > 0 && enemyLoss > 0) {
          ratioEl.textContent = '战损比（我方 : 敌军） 1 : ' + (enemyLoss / ownLoss).toFixed(1);
        } else if (enemyLoss > 0) {
          ratioEl.textContent = '我方零伤亡';
        } else if (ownLoss > 0) {
          ratioEl.textContent = '敌军零伤亡';
        } else {
          ratioEl.textContent = '双方均无伤亡';
        }
      }

      var primary = document.getElementById('resultPrimary');
      var subtitleEl = document.getElementById('resultSubtitle');

      /* 关卡索引：取战役名（副标题）+ 计算下一战场（与游戏内「下一关」逻辑同源） */
      fetch('/assets/levels/index.json')
        .then(function (res) { return res.ok ? res.json() : null; })
        .then(function (index) {
          var levels = (index && index.levels) ? index.levels : [];
          var current = levels.findIndex(function (l) { return l.id === levelId; });

          if (current >= 0) {
            document.title = data.verdict + ' · ' + levels[current].name;
            subtitleEl.textContent = levels[current].name + (timeText ? ' · 用时 ' + timeText : '');
          } else if (timeText) {
            subtitleEl.textContent = '用时 ' + timeText;
          }

          if (result === 'victory') {
            if (levelId === ENDING_LEVEL) {
              /* 通关最后一战：原"返回战役选择"位置改跳结局页（ending.html 里也有返回按钮） */
              primary.textContent = '结局';
              primary.setAttribute('href', './ending.html');
              return;
            }
            var next = current >= 0 ? levels[current + 1] : null;
            if (next) {
              primary.textContent = '下一战场';
              /* 跳到下一战役的 battlebackground（看战役背景介绍 / 入场视频），不是直接进游戏 */
              primary.setAttribute('href', './battlebackground.html?level=' + encodeURIComponent(next.id));
            } else {
              primary.textContent = '返回战役选择';
              primary.setAttribute('href', './battlechoose.html');
            }
          } else {
            primary.textContent = '重新开始';
            primary.setAttribute('href',
              levelId ? './game.html?level=' + encodeURIComponent(levelId) : './battlechoose.html');
          }
        })
        .catch(function () {
          if (timeText) subtitleEl.textContent = '用时 ' + timeText;
          if (result === 'victory') {
            if (levelId === ENDING_LEVEL) {
              /* 索引拉不到时也要能进结局（离线 / 资源挂掉时走这条）；
                 按钮文案与上面正常分支保持一致 */
              primary.textContent = '结局';
              primary.setAttribute('href', './ending.html');
            } else {
              primary.textContent = '返回战役选择';
              primary.setAttribute('href', './battlechoose.html');
            }
          } else if (levelId) {
            primary.setAttribute('href', './game.html?level=' + encodeURIComponent(levelId));
          }
        });

      /* ★ 衔接 result-video.html：黑蒙版淡出 + 内容微弹入，丝滑过场 */
      (function () {
        var fromVideo = false;
        try { fromVideo = sessionStorage.getItem('war-of-dots.result.from-video') === '1'; } catch (e) {}
        if (!fromVideo) return;
        try { sessionStorage.removeItem('war-of-dots.result.from-video'); } catch (e) {}

        document.body.classList.add('video-continuation');

        /* 蒙版动画（黑→暖米黄→透明）已经在 .video-continuation 上自动启动；
           这里只需触发内容层的弹入（revealed 仍然负责 nav/hero/shell 的过渡） */
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            document.body.classList.add('revealed');
          });
        });

        /* 蒙版 0.28s 暖化 + 0.82s 淡出（0.28s 起）= 总 1.10s
           + 内容层 0.92s 起 + 0.9s 缓动 = 总 1.82s
           加 0.3s 余量 → 2.10s 后移除 video-continuation class，
           让战斗场的暖米黄底色（已和蒙版一致）正式接管 */
        setTimeout(function () { document.body.classList.remove('video-continuation'); }, 2100);
      })();
    })();
  </script>
