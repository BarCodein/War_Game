# ─────────────────────────────────────────────────────────────────────────────
# War of Dots · PvP 反代片段（linux / nginx 1.24+）
#
# 用法：把下面两个 location 贴进 **现有** /etc/nginx/sites-enabled/default 的
#       server { ... } 里（建议放在 `location / {` 之前），然后：
#           sudo nginx -t && sudo systemctl reload nginx
#
# 前提：
#   · 静态站点已由同一个 server 块托管（root /var/www/html/war_game/repo;）——不变
#   · 视频 location /videos/ —— 不变
#   · Node 服务监听 127.0.0.1:3001（deploy/war-game.service），**不要**对公网开这个端口
#
# 为什么不用配 CORS、不用证书：页面、REST、WebSocket 全在 http://<同一个IP> 这个源下
#（docs/pvp-plan.md §2.2 / §2.3 的 O1 方案）。
# ─────────────────────────────────────────────────────────────────────────────

server {
    # ……你现有的 listen / server_name / index 保持不动……

    # ---------- PvP：账号、房间等 REST ----------
    location /api/ {
        # 注意：proxy_pass 后面**不带 URI**，/api/** 会原样透传给 Node
        #（所以 Node 侧的路由就挂在 /api/health、/api/auth/login …）
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # ---------- PvP：对局 WebSocket ----------
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;   # 关键：WebSocket 升级
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 对局期间是长连接：别用默认 60s 掐断
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ---------- 静态（现有配置，示例，按你机器上的实际内容） ----------
    # location /videos/ {
    #     alias /var/www/html/videos/;
    #     try_files $uri $uri/ =404;
    # }
    # location / {
    #     root /var/www/html/war_game/repo;
    #     try_files $uri $uri/ =404;
    # }
}
