<!doctype html>
<!--
  bgm.html — 全局 BGM 播放器（被各非游玩页面通过 <iframe> 嵌入）

  设计要点：
  1. 单 audio 元素 + loop=true，无缝循环
  2. 跨页"接力"：每个页面都嵌入一个本 iframe；通过 localStorage 共享
     播放位置（currentTime）。新页面创建的 iframe 加载后从
     localStorage 读取上次的 currentTime 续播，弥补页面切换的断裂。
  3. 默认自动播放：除用户显式暂停过之外，进入任何带 BGM 控件的页面都
     自动播放（不需要先点页面）。这是通过 audio.muted + 立即 play
     来"骗过" Chrome autoplay 策略实现的——同源/同 frame 的 muted
     audio 允许自动播放。
  4. UI 控件（播放/暂停按钮）由父页面通过 postMessage 操控；本页面
     不渲染可见控件（保持极简，0×0 不可见）。
-->
<html>
<head>
<meta charset="UTF-8">
<title>BGM</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body { display: none; } /* 不可见 */
</style>
</head>
<body>
<audio id="bgm" loop preload="auto" muted></audio>
<script>
(function () {
  'use strict';
  var audio = document.getElementById('bgm');
  // 每页通过 ?song= 指定要播放的 BGM（默认《江山如此多娇》）。
  // 若 URL 没指定，去 localStorage 找"上一首在播的歌"（任意 war-of-dots.bgm.* 键里 paused=false 的那首），
  // 让 result-video / ending 这类"无 BGM 控件但需跨页接管 BGM"的页面能接力正确歌曲。
  var explicitSong = new URLSearchParams(location.search).get('song');
  var song;
  if (explicitSong) {
    song = explicitSong.replace(/[^a-zA-Z0-9_-]/g, '');
  } else {
    song = 'jiangshanruciduojiao';
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k.indexOf('war-of-dots.bgm.') !== 0) continue;
        var s = JSON.parse(localStorage.getItem(k) || 'null');
        if (s && s.paused === false) {
          song = k.slice('war-of-dots.bgm.'.length);
          break;
        }
      }
    } catch (e) {}
  }
  audio.src = '/assets/bgm/' + song + '.mp3';
  audio.load();
  // 各歌音量：默认 0.4；《在太行山上》用户要求"大点声"，单独调高
  var VOLUMES = { zaitaihangshandshang: 0.8 };
  audio.volume = (Object.prototype.hasOwnProperty.call(VOLUMES, song)) ? VOLUMES[song] : 0.4;
  // 续播进度按「歌曲」分别存储，避免不同歌之间错位续播
  var STORAGE_KEY = 'war-of-dots.bgm.' + song;
  // **用户意图**：用户有没有显式关掉 BGM。
  // 不能拿 audio.paused 代替——过场视频让位（互斥）时 audio.paused 也是 true，
  // 那不代表用户关过；把 raw 状态写进 localStorage，会让下一个页面（以及结局页的
  // "视频播完起 BGM"）误以为用户关了音乐，从此一直不出声。
  var intentPaused = false;

  // 加载时从 localStorage 接力
  try {
    var saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if (saved && typeof saved.t === 'number') {
      audio.currentTime = saved.t;
    }
    intentPaused = !!(saved && saved.paused);
    // muted=true 时 autoplay 一定成功（即使没 user activation），先把播放跑起来
    if (intentPaused) {
      // 用户曾显式暂停过 → 保持暂停，不自动播
      audio.muted = true;
      // 不调 play()
    } else {
      // 默认：尝试自动播
      var p = audio.play();
      if (p && p.catch) p.catch(function () {});
    }
  } catch (e) {
    // localStorage 读失败：直接尝试自动播
    var p2 = audio.play();
    if (p2 && p2.catch) p2.catch(function () {});
  }

  // 解除静音：一旦父页面给 start 信号或用户首次与父页面交互，
  // 才把 audio.muted 设为 false，让用户真正听到声音
  function unmute() {
    audio.muted = false;
  }

  // 持续上报播放位置（让下一个接力的 iframe 能续上）。
  // paused 写的是**用户意图**（intentPaused），不是 audio.paused：
  // 视频让位造成的暂停不该被记成"用户把 BGM 关了"。
  setInterval(function () {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        t: audio.currentTime || 0,
        paused: intentPaused,
        muted: audio.muted
      }));
    } catch (e) {}
  }, 500);

  // 视频-BGM 互斥（轮询 localStorage 标记，零跨 frame 依赖）：
  //   当任意含 <video> 的页面有 video 在播时，写 localStorage.war-of-dots.video-playing = '1'；
  //   视频结束/暂停时写 '0'。bgm.html 每 100ms 检查这个标记，
  //   若 BGM 当前在响 + 标记为 '1' → 暂停 + 记 __wasPlayingBeforeVideo；
  //   若标记为 '0' 且之前被 video 暂停过 → 恢复。
  //   这种方式不依赖 postMessage 跨 frame 寻址，最稳。
  (function () {
    var VIDEO_FLAG_KEY = 'war-of-dots.video-playing';
    // 读初始状态：若进入页面时视频已经在播（不太可能，但兜底），立即让位
    try {
      if (localStorage.getItem(VIDEO_FLAG_KEY) === '1') {
        audio.__wasPlayingBeforeVideo = !audio.paused && !audio.muted;
        audio.pause();
      }
    } catch (e) {}
    setInterval(function () {
      try {
        var flag = localStorage.getItem(VIDEO_FLAG_KEY);
        if (flag === '1') {
          if (!audio.paused && !audio.muted) {
            // 之前在响 → 记下"原状态"并让位
            audio.__wasPlayingBeforeVideo = true;
          }
          audio.pause();
        } else if (flag === '0' || flag === null) {
          if (audio.__wasPlayingBeforeVideo) {
            audio.__wasPlayingBeforeVideo = false;
            unmute();
            var p4 = audio.play();
            if (p4 && p4.catch) p4.catch(function () {});
          }
        }
      } catch (e) {}
    }, 100);
  })();

  // 父页面 postMessage 协议：
  //   { cmd: 'start' }     — 用户首次交互后解锁（unmute + play）
  //   { cmd: 'play' }      — 播放
  //   { cmd: 'pause' }     — 暂停
  //   { cmd: 'toggle' }    — 切换播放/暂停
  //   { cmd: 'status' }    — 查询状态
  window.addEventListener('message', function (e) {
    var msg = e.data;
    if (!msg || typeof msg !== 'object') return;
    if (msg.cmd === 'start' || msg.cmd === 'play') {
      // 显式起播（进页面自动续播 / 页面自己调 BgmStart）→ 用户意图 = 要音乐
      intentPaused = false;
      unmute();
      var p = audio.play();
      if (p && p.catch) p.catch(function () {});
    } else if (msg.cmd === 'pause') {
      // 内部让位（过场视频要出声）**不改用户意图**：视频结束后页面还能再叫它起来
      audio.pause();
    } else if (msg.cmd === 'toggle') {
      // 用户点的按钮：按"意图"翻，而不是按 audio.paused
      intentPaused = !intentPaused;
      if (!intentPaused) {
        unmute();
        var p2 = audio.play();
        if (p2 && p2.catch) p2.catch(function () {});
      } else {
        audio.pause();
      }
    } else if (msg.cmd === 'status') {
      try {
        e.source && e.source.postMessage({
          cmd: 'status',
          paused: intentPaused,
          t: audio.currentTime || 0,
          muted: audio.muted
        }, '*');
      } catch (err) {}
    } else if (msg.cmd === 'video-state') {
      // 父页面 / 同源任一含 video 的页面通知：
      //   playing=true  → BGM 必须让位（视频要出声），记下"原本在播"
      //   playing=false → 若"原本在播"则恢复；用户已手动暂停的 BGM 不恢复
      try {
        if (msg.playing) {
          // 记下"是否本就在播"：只对未暂停、未手动静音的 BGM 记为 true
          // （用户已显式暂停的 BGM 视频结束后不会恢复）
          audio.__wasPlayingBeforeVideo = !audio.paused && !audio.muted;
          audio.pause();
        } else {
          if (audio.__wasPlayingBeforeVideo) {
            audio.__wasPlayingBeforeVideo = false;
            unmute();
            var p3 = audio.play();
            if (p3 && p3.catch) p3.catch(function () {});
          }
        }
      } catch (err) {}
    }
  });

  // 通知父页面：iframe 已就绪
  try { parent.postMessage({ cmd: 'ready' }, '*'); } catch (e) {}
})();
</script>
</body>
</html>
