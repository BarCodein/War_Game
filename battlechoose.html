  <script>
    /* 未登录守卫：本页是 classic script 页面（不能 import /src/auth.js），
       这里做与 src/auth.js 的 requireAuth() 同一套判断：没有会话 → 跳登录页并带 next。
       放在最前面，避免先渲染再被弹走。 */
    (function () {
      try {
        var session = JSON.parse(localStorage.getItem('war-of-dots.session') || 'null');
        if (session && session.username) return;
        var next = window.location.pathname + window.location.search + window.location.hash;
        window.location.replace('/login.html?next=' + encodeURIComponent(next));
      } catch (e) {
        window.location.replace('/login.html');
      }
    })();

  <section class="map-shell">
    <div class="map-viewport" id="mapViewport">
      <!-- 地图画布：<img.map-img> 渲染真实地图；关卡点绝对定位。
           地图初始 width/height = 220%（CSS），再叠加 transform scale，
           形成「初始放大、细节清晰」的视觉效果。
      -->
      <div class="map-canvas" id="mapCanvas">

        <!-- ★ 背景地图接口（替换 src 即可换图） -->
        <img class="map-img" id="mapImg" src="./assets/texture/index.png" alt="中国军事地图" draggable="false">

        <!-- 关卡点（绝对定位在 .map-canvas 上，left/top 是 canvas 的百分比）
             ⚠️ 坐标必须落在 canvas 的 60% ~ 160% 区间内，否则页面上看不到：
             .map-canvas 撑满 viewport（100%），里面的 .map-img 是它的 220%，
             而 resetMap() 会把这张大图居中，于是初始可视区域正好是 canvas 的
             60%~160%（x/y 都是）——超出这一带的点被推到视口外。
             实测（Chrome 1440×900 → viewport 1232×620，transform
             translate(-739.2px,-372px) scale(1)）：旧坐标 40%/18% 与 80%/46%
             的视口坐标是 (-246,-258) 和 (244,-86)，两点都在视口外。
             另外要避开右上角的预览卡（right:24px top:24px，宽 280px）

        <!-- 第五关：渡江战役 —— 跳转链接由脚本里的 battleData[6].level 提供
             （键 5 已被"地形与士气教学"占用，所以渡江用键 6，避免对象字面量里的重复键互相覆盖） -->
        <div class="battle-pin unlocked" data-level="6" style="left:146%; top:142%;">
          <span class="pin-dot"></span>
          <span class="pin-label">渡江战役</span>
        </div>
        <!-- 第六关：平津战役 —— 跳转链接由脚本里的 battleData[7].level 提供 -->
        <div class="battle-pin unlocked" data-level="7" style="left:114%; top:94%;">

      </div>

      <!-- 缩放/复位控件 -->
      <div class="map-controls">
        <button id="zoomIn" title="放大">+</button>
        <button id="zoomOut" title="缩小">&minus;</button>
        <button id="zoomReset" title="复位">&#8962;</button>
      </div>

      <!-- 关卡预览卡 -->
      <aside class="battle-preview" id="battlePreview">
        <h3 id="previewName">宿北战役</h3>

        <p id="previewDesc">山东野战军与华中野战军联合作战，于江苏宿迁北部歼灭国民党军整编第69师，是解放战争战略防御阶段的重要转折。</p>
        <a class="battle-btn" id="previewEnter" href="./battlebackground.html?level=subei_battle">进入战役 &rarr;</a>

  <!-- 按账号隔离的本地存储（classic script 版；与 src/user-storage.js 同逻辑） -->
  <script src="/user-storage.js"></script>
  <script>
    /* =========================================================
       关卡选择页交互逻辑
       - 过场动画：默认 2.6s 后自动淡出（若接入视频，改为视频 ended 后淡出）
       - 地图缩放：滚轮 / 双指（0.6x ~ 3x）
       - 地图平移：鼠标拖拽 / 单指拖动
       - 自动放大：点击关卡，平滑聚焦到该点并高亮
       - 关卡预览卡：点击关卡显示对应战役信息
       ========================================================= */

    (function () {
      /* ★ 仅在从 index 首页进入时才播 CG；从结算页/其他来源进入时不播 */
      var fromIndex = (new URLSearchParams(window.location.search).get('from') === 'index');
      var overlay = document.getElementById('cutsceneOverlay');
      var video = document.getElementById('cutsceneVid');
      var content = document.getElementById('cutsceneContent');

      if (fromIndex) {
        var finished = false;
        var titleHidden = false;
        function hideTitle() {
          if (titleHidden || !content) return;
          titleHidden = true;
          content.classList.add('fade-out');
        }
        function endCutscene() {
          if (finished || !overlay) return;
          finished = true;
          // 标题先隐藏（保险）
          hideTitle();
          overlay.classList.add('fade-out');
          // 淡出动画结束后移除遮罩，释放交互
          setTimeout(function () {
            if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
          }, 700);
        }

        // 点击 overlay 任意位置 → 跳过过场动画
        if (overlay) overlay.addEventListener('click', endCutscene);

        if (video) {
          // 视频加载失败/不存在 → 直接结束过场，不卡死
          video.addEventListener('error', endCutscene);
          // 视频开始播放后 5 秒 → 渐隐开场文字（视频继续）
          video.addEventListener('play', function () {
            setTimeout(hideTitle, 5000);
          });
          // 触发播放（带声音）
          var p = video.play();
          if (p && typeof p.catch === 'function') {
            p.catch(function () {
              // 浏览器拦截带声音的自动播放 → 降级为静音播放保底
              video.muted = true;
              var p2 = video.play();
              if (p2 && typeof p2.catch === 'function') {
                p2.catch(endCutscene);
              }
            });
          }
          // 视频完整播放结束后才淡出整个 overlay
          video.addEventListener('ended', endCutscene);
        } else {
          // 无视频元素时兜底：5s 隐藏标题、2.6s 后结束
          setTimeout(hideTitle, 5000);
          setTimeout(endCutscene, 2600);
        }
      } else {
        /* 非 index 来源：直接摘掉过场遮罩，不播视频 */
        if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
      }

      /* ---------- 地图缩放 / 平移 ---------- */
      var viewport = document.getElementById('mapViewport');
      var canvas = document.getElementById('mapCanvas');
      if (!viewport || !canvas) return;

      var scale = 1;
      var tx = 0, ty = 0;
      // ★ 缩放边界放宽（让地图初始就大、且能放大到能看清地图细节）
      var MIN = 0.8, MAX = 4.0;
      var dragging = false;
      var startX = 0, startY = 0, startTx = 0, startTy = 0;
      // 双指缩放起始
      var pinchStartDist = 0, pinchStartScale = 1;

      function applyTransform(animate) {
        if (animate === false) {
          canvas.classList.add('no-transition');
        } else {
          canvas.classList.remove('no-transition');
        }
        canvas.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
        if (animate === false) {
          requestAnimationFrame(function () { canvas.classList.remove('no-transition'); });
        }
      }

      function clampScale(s) {
        return Math.min(MAX, Math.max(MIN, s));
      }

      /* =====================================================================
         关键：边界 clamp —— 保证地图任何时刻都不能被拖出 viewport 之外
         计算依据：地图图实际尺寸 = viewport.w * scale（因为 .map-img 的
         width/height = 220%，且 transform-origin: 0 0）
         平移 tx 的合法范围：让图右边界不超出 viewport 右边界、图左边界不超出 viewport 左边界
         ===================================================================== */
      function clampPan() {
        var rect = viewport.getBoundingClientRect();
        var vw = rect.width, vh = rect.height;
        // .map-img 在没有 transform 时大小 = viewport 的 220%
        var imgW = vw * 2.2 * scale;
        var imgH = vh * 2.2 * scale;
        // 上下/左右边界：保证 img 完全覆盖 viewport
        // tx 必须位于 [vw - imgW, 0]，ty 类似
        if (imgW > vw) {
          tx = Math.min(0, Math.max(vw - imgW, tx));
        } else {
          // img 比 viewport 还小 → 居中（极少发生，因 MIN=0.8 且图初始 220%）
          tx = (vw - imgW) / 2;
        }
        if (imgH > vh) {
          ty = Math.min(0, Math.max(vh - imgH, ty));
        } else {
          ty = (vh - imgH) / 2;
        }
      }

      // 滚轮缩放（以鼠标位置为锚点 + 边界 clamp）
      viewport.addEventListener('wheel', function (e) {
        e.preventDefault();
        var rect = viewport.getBoundingClientRect();
        var mx = e.clientX - rect.left;
        var my = e.clientY - rect.top;
        var factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
        var newScale = clampScale(scale * factor);

        // 以鼠标位置为中心缩放：调整平移量
        tx = mx - (mx - tx) * (newScale / scale);
        ty = my - (my - ty) * (newScale / scale);
        scale = newScale;
        clampPan();
        applyTransform();
      }, { passive: false });

      // 鼠标拖拽平移（带边界 clamp）
      viewport.addEventListener('mousedown', function (e) {
        dragging = true;
        startX = e.clientX; startY = e.clientY;
        startTx = tx; startTy = ty;
        viewport.classList.add('dragging');
        applyTransform(false);
      });
      window.addEventListener('mousemove', function (e) {
        if (!dragging) return;
        tx = startTx + (e.clientX - startX);
        ty = startTy + (e.clientY - startY);
        clampPan();
        applyTransform(false);
      });
      window.addEventListener('mouseup', function () {
        if (dragging) {
          dragging = false;
          viewport.classList.remove('dragging');
        }
      });

      // 触屏：单指平移 / 双指缩放（带边界 clamp）
      viewport.addEventListener('touchstart', function (e) {
        if (e.touches.length === 1) {
          dragging = true;
          startX = e.touches[0].clientX;
          startY = e.touches[0].clientY;
          startTx = tx; startTy = ty;
          applyTransform(false);
        } else if (e.touches.length === 2) {
          dragging = false;
          var dx = e.touches[0].clientX - e.touches[1].clientX;
          var dy = e.touches[0].clientY - e.touches[1].clientY;
          pinchStartDist = Math.sqrt(dx * dx + dy * dy);
          pinchStartScale = scale;
        }
      }, { passive: false });
      viewport.addEventListener('touchmove', function (e) {
        e.preventDefault();
        if (e.touches.length === 1 && dragging) {
          tx = startTx + (e.touches[0].clientX - startX);
          ty = startTy + (e.touches[0].clientY - startY);
          clampPan();
          applyTransform(false);
        } else if (e.touches.length === 2) {
          var dx = e.touches[0].clientX - e.touches[1].clientX;
          var dy = e.touches[0].clientY - e.touches[1].clientY;
          var dist = Math.sqrt(dx * dx + dy * dy);
          scale = clampScale(pinchStartScale * (dist / pinchStartDist));
          clampPan();
          applyTransform(false);
        }
      }, { passive: false });
      viewport.addEventListener('touchend', function () {
        dragging = false;
      });

      // 缩放/复位控件（带边界 clamp）
      document.getElementById('zoomIn').addEventListener('click', function () {
        var rect = viewport.getBoundingClientRect();
        var mx = rect.width / 2, my = rect.height / 2;
        var newScale = clampScale(scale * 1.2);
        tx = mx - (mx - tx) * (newScale / scale);
        ty = my - (my - ty) * (newScale / scale);
        scale = newScale;
        clampPan();
        applyTransform();
      });
      document.getElementById('zoomOut').addEventListener('click', function () {
        var rect = viewport.getBoundingClientRect();
        var mx = rect.width / 2, my = rect.height / 2;
        var newScale = clampScale(scale / 1.2);
        tx = mx - (mx - tx) * (newScale / scale);
        ty = my - (my - ty) * (newScale / scale);
        scale = newScale;
        clampPan();
        applyTransform();
      });
      // ★ 复位：恢复到「初始放大+居中」状态（不是 1:1）
      document.getElementById('zoomReset').addEventListener('click', function () {
        resetMap();
      });

      /* =====================================================================
         初始化：地图一进入页面就放到「比 viewport 大」的状态（参照你截图）。
         这里把 scale 设为 1.0（在 MIN/MAX 内）、图片本身 = 220%，再通过
         clampPan 让图中心对齐 viewport 中心，最终视觉 = 截图里那种「地图
         满满、细节可见」的初始状态。
         ===================================================================== */
      function resetMap() {
        scale = 1.0;
        var rect = viewport.getBoundingClientRect();
        // 让地图图（vw*2.2）居中显示
        var imgW = rect.width * 2.2;
        var imgH = rect.height * 2.2;
        tx = (rect.width - imgW) / 2;
        ty = (rect.height - imgH) / 2;
        applyTransform();
      }

      // 等 map-img 加载完成后再 reset（避免未加载时尺寸异常）
      var mapImg = document.getElementById('mapImg');
      if (mapImg && mapImg.complete) {
        resetMap();
      } else if (mapImg) {
        mapImg.addEventListener('load', resetMap);
        mapImg.addEventListener('error', resetMap);
      } else {
        resetMap();
      }

      // 窗口尺寸变化时，重新 clamp 防越界
      window.addEventListener('resize', function () {
        clampPan();
        applyTransform();
      });

      /* ---------- 关卡点交互 ---------- */
      // 战役数据（可扩展，作为接口由后端/JS 数据源填充）
      // level 是关卡 id，跳转时会同时写进 ?level= 与 #level=：
      // 静态服务器（如 npx serve 的 cleanUrls）会把 "/x.html?level=y" 301 重写成
      // "/x" 并丢掉查询参数，只有 hash 一定保留；另外还会写一份 sessionStorage 兜底。
      var battleData = {
        0: { name: '基础教学', date: '新兵训练', desc: '一步一步学习选择单位、移动、攻击、框选和绘制行军轨迹，掌握 RTS 基础操作。', level: 'fracture-canyon-tutorial' },
        5: { name: '地形以及补给系统', date: '战术演训', desc: '深入学习地形利用（道路/城镇/山地/森林/水域）与补给系统机制，体会不同地形和补给线对战斗的影响。', level: 'tactical-training-tutorial' },
        1: { name: '辽沈战役', date: '1948年9月 — 1948年11月', desc: '东北野战军发起辽沈战役，解放东北全境，奠定全国胜利基础。', level: 'tashan_battle' },
        2: { name: '宿北战役', date: '1946年12月', desc: '山东野战军与华中野战军联合作战，于江苏宿迁北部歼灭国民党军整编第69师，是解放战争战略防御阶段的重要转折。', level: 'subei_battle' },
        3: { name: '西安', date: '1936年12月', desc: '回忆起了36年12月的西安', level: 'xian_battle' },
        4: { name: '双堆集战役', date: '1948年11月 — 1948年12月', desc: '中原野战军将黄维兵团包围于双堆集，经二十余日激战将其全歼，淮海战役第二阶段胜利结束。', level: 'shuangduiji_battle' },
        6: { name: '渡江战役', date: '1949年4月 — 1949年6月', desc: '第二、第三和第四野战军一部，在长江中、下游地区进行规模巨大的强渡江河战役。一举突破国民党军的长江防线。', level: 'dujiang_battle' },
        7: { name: '平津战役', date: '1948年11月 — 1949年1月', desc: '东北野战军入关会同华北军区部队，先打两头（张家口、天津）、后取中间（北平），促成北平和平解放。', level: 'pingjin_battle' }
      };

      function battleHref(level) {
        if (!level) return './battlebackground.html';
        var id = encodeURIComponent(level);
        return './battlebackground.html?level=' + id + '#level=' + id;
      }

      function rememberLevel(level) {
        try { if (level) window.sessionStorage.setItem('war-of-dots.campaign', level); } catch (e) { /* 忽略 */ }
      }

      var preview = document.getElementById('battlePreview');
      var previewName = document.getElementById('previewName');
      var previewDate = document.getElementById('previewDate');
      var previewDesc = document.getElementById('previewDesc');
      var previewEnter = document.getElementById('previewEnter');

      var pins = document.querySelectorAll('.battle-pin');

      /* ---------- 关卡解锁：按顺序开放 ----------
         · 链条 PROGRESSION = 战役关卡按 levels/index.json 的顺序串起来，**通关前一关**才开下一关；
         · 教学关（基础教学 / 地形与补给）与西安事变始终开放；断裂峡谷不在地图 pin 上、不进链条；
         · 通关信号 = 胜利时 HUD 写入的 war-of-dots.campaign-progress[levelId].completed（失败不写）。 */
      var PROGRESSION = ['subei_battle', 'tashan_battle', 'shuangduiji_battle', 'pingjin_battle', 'dujiang_battle'];
      var ALWAYS_UNLOCKED = ['fracture-canyon-tutorial', 'tactical-training-tutorial', 'xian_battle'];
      var PROGRESS_NAME = 'campaign-progress';

      function loadProgress() {
        // 进度按账号隔离：真正的键 = war-of-dots.u.<账号>.campaign-progress
        if (!window.UserStorage) {
          console.warn('[battlechoose] 缺少 /user-storage.js，解锁进度按"空"处理');
          return {};
        }
        window.UserStorage.migrateLegacy(); // 首次升级后把旧版全局进度迁给当前账号
        var saved = window.UserStorage.readJSON(PROGRESS_NAME, {});
        return saved && typeof saved === 'object' ? saved : {};
      }

      function isCleared(levelId) {
        var record = loadProgress()[levelId];
        return Boolean(record && (record.completed === true || (record.wins || 0) > 0));
      }

      function isUnlocked(levelId) {
        if (!levelId) return true;                              // 没有关卡 id 的条目不锁
        if (ALWAYS_UNLOCKED.indexOf(levelId) >= 0) return true; // 教学关与西安始终开
        var index = PROGRESSION.indexOf(levelId);
        if (index < 0) return true;                             // 不在链条里的关卡不锁（防漏写）
        if (index === 0) return true;                           // 链条首关始终开
        return isCleared(PROGRESSION[index - 1]);
      }

      // 上一关的中文名（提示文案用）
      function previousLevelName(levelId) {
        var index = PROGRESSION.indexOf(levelId);
        if (index <= 0) return '';
        var prev = PROGRESSION[index - 1];
        var key = Object.keys(battleData).find(function (k) { return battleData[k].level === prev; });
        return key === undefined ? prev : battleData[key].name;
      }

      // 把解锁状态刷到 pin 上：锁定 → 灰化 + 锁图标 + aria-disabled
      function refreshPinLocks() {
        pins.forEach(function (pin) {
          var data = battleData[pin.getAttribute('data-level')];
          var unlocked = isUnlocked(data ? data.level : null);
          pin.classList.toggle('locked', !unlocked);
          pin.classList.toggle('unlocked', unlocked);
          if (unlocked) pin.removeAttribute('aria-disabled');
          else pin.setAttribute('aria-disabled', 'true');
          var icon = pin.querySelector('.pin-lock-icon');
          if (!unlocked && !icon) {
            icon = document.createElement('span');
            icon.className = 'pin-lock-icon';
            pin.appendChild(icon);
          } else if (unlocked && icon) {
            icon.parentNode.removeChild(icon);
          }
        });
      }

      refreshPinLocks();
      // 从战场返回（前进/后退缓存）时进度可能刚更新，重新算一次
      window.addEventListener('pageshow', refreshPinLocks);

      pins.forEach(function (pin) {
        pin.addEventListener('click', function (e) {
          e.stopPropagation();
          var lv = pin.getAttribute('data-level');
          var data = battleData[lv] || { name: '未知战役', date: '', desc: '', level: null };

          // 高亮当前 pin（未解锁的也能看卡片）
          pins.forEach(function (p) { p.classList.remove('current'); });
          pin.classList.add('current');

          // 填充预览卡
          previewName.textContent = data.name;
          previewDate.textContent = data.date;
          previewDesc.textContent = data.desc;
          preview.classList.add('show');
          applyEnterState(data, !pin.classList.contains('locked'));

          // 自动放大聚焦到该关卡
          autoFocusPin(pin);
        });
      });

      /**
       * "进入战役"按钮状态：
       *   已解锁 → 正常可点（教学关走本页 overlay，其余跳 battlebackground）；
       *   未解锁 → 卡片照常打开，按钮置灰、文案改"未解锁"、去掉 href 且点不动，
       *            鼠标悬停用 title 说明要先通关哪一关。
       */
      function applyEnterState(data, unlocked) {
        if (!unlocked) {
          previewEnter.classList.add('disabled');
          previewEnter.setAttribute('aria-disabled', 'true');
          previewEnter.removeAttribute('href');
          var prev = previousLevelName(data.level);
          previewEnter.title = prev ? '先通关「' + prev + '」才能进入' : '尚未解锁';
          previewEnter.textContent = '未解锁';
          previewEnter.onclick = function (e) { e.preventDefault(); };
          return;
        }
        previewEnter.classList.remove('disabled');
        previewEnter.removeAttribute('aria-disabled');
        previewEnter.removeAttribute('title');
        previewEnter.innerHTML = '进入战役 &rarr;';
        previewEnter.href = battleHref(data.level);
        rememberLevel(data.level);

        // 教学关卡：点击"进入战役"不跳 battlebackground，直接在本页显示 loading 后进游戏
        if (data.level === 'fracture-canyon-tutorial' || data.level === 'tactical-training-tutorial') {
          previewEnter.onclick = function (e) {
            e.preventDefault();
            startTutorialLoading(data.level);
          };
        } else {
          previewEnter.onclick = null;
        }
      }

      function autoFocusPin(pin) {
        var rect = viewport.getBoundingClientRect();
        var pinRect = pin.getBoundingClientRect();
        // pin 中心相对视口的坐标
        var pinCenterX = pinRect.left - rect.left + pinRect.width / 2;
        var pinCenterY = pinRect.top - rect.top + pinRect.height / 2;

        var targetScale = 2.0; // 自动聚焦目标缩放
        var ratio = targetScale / scale;
        tx = rect.width / 2 - (pinCenterX - tx) * ratio;
        ty = rect.height / 2 - (pinCenterY - ty) * ratio;
        scale = targetScale;

        clampPan();
        applyTransform();
      }

      // 点击地图空白处关闭预览卡
      viewport.addEventListener('click', function (e) {
        if (e.target === canvas || e.target === viewport) {
          preview.classList.remove('show');
        }
      });

      // 教学关卡：在战役选择地图上直接显示 loading 进度条，完成后进 game.html
      function startTutorialLoading(levelId) {
        var targetLevel = levelId || 'fracture-canyon-tutorial';
        var overlay = document.getElementById('tutorialLoadingOverlay');
        var fill = document.getElementById('tutLoadingFill');
        var task = document.getElementById('tutLoadingTask');
        if (!overlay || !fill) return;
        preview.classList.remove('show');
        overlay.classList.add('show');
        window.playSfx && window.playSfx('loading');
        var tasks = ['正在集结部队…', '正在部署兵力…', '正在侦察敌情…', '正在绘制战场…', '即将进入战场…'];
        var progress = 0, lastIdx = -1;
        var timer = setInterval(function () {
          progress += Math.random() * 7 + 3;
          if (progress >= 100) {
            progress = 100;
            clearInterval(timer);
            task.textContent = '准备就绪';
            fill.style.width = '100%';
            setTimeout(function () {
              var enc = encodeURIComponent(targetLevel);
              window.location.href = './game.html?level=' + enc + '#level=' + enc;
            }, 500);
          } else {
            var idx = Math.floor(progress / (100 / tasks.length));
            if (idx >= tasks.length) idx = tasks.length - 1;
            if (idx !== lastIdx) { task.textContent = tasks[idx]; lastIdx = idx; }
            fill.style.width = progress + '%';
          }
        }, 180);
      }
    })();
  </script>

  <script src="/audio.js"></script>
  <script src="/bgm-controller.js"></script>
  <script>
    // 视频-BGM 互斥（v5：localStorage 标记）。cutsceneVid 是 battlechoose 唯一的过场视频。
    (function () {
      var KEY = 'war-of-dots.video-playing';
      function set(on) { try { localStorage.setItem(KEY, on ? '1' : '0'); } catch (e) {} }
      var v = document.getElementById('cutsceneVid');
      if (v && !v.__bgmVideoLock) {
        v.__bgmVideoLock = true;
        v.addEventListener('play',  function () { set(true); });
        v.addEventListener('ended', function () { set(false); });
        v.addEventListener('pause', function () { if (!v.ended) set(false); });
        if (!v.paused && !v.ended) set(true);
      }
      window.addEventListener('pagehide', function () { set(false); });
      window.addEventListener('beforeunload', function () { set(false); });
    })();
  </script>
  <script>
    // UI 音效：导航返回 / 缩放控件 / 关卡点 / 进入战役
    window.bindSfx({
      '.battle-nav a': 'click',
      '.map-controls button': 'click',
      '.battle-pin': 'click',
      '#previewEnter': 'button'
    });
  </script>

  <!-- 教学关卡 loading 覆盖层（直接显示在战役选择地图上） -->
  <div id="tutorialLoadingOverlay">
    <div class="tut-loading-box">
      <div class="tut-loading-eyebrow">COMMAND TRAINING</div>
      <h2 class="tut-loading-title">新兵指挥训练</h2>
      <div class="tut-loading-task" id="tutLoadingTask">正在集结部队…</div>
      <div class="tut-loading-track">
        <div class="tut-loading-fill" id="tutLoadingFill"></div>
      </div>
      <div class="tut-loading-hint">加载中</div>
    </div>
  </div>
</body>
</html>
