<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>沙盘战争 — 战役背景</title>
  <link rel="stylesheet" href="./members/css/battlepages.css">
</head>
<body>

  <!-- ==================== 导航条 ==================== -->
  <nav class="battle-nav">
    <div class="battle-nav-inner">
      <a class="battle-nav-back" href="./battlechoose.html">&larr; 返回关卡</a>
      <a class="battle-nav-brand" href="./index.html">
        <span class="nav-mark">&#9876;</span> 沙盘战争
      </a>
    </div>
  </nav>

  <!-- ==================== 页面标题（JS 按 ?level= 填充） ==================== -->
  <section class="battle-hero">
    <span class="hero-eyebrow">CAMPAIGN BACKGROUND</span>
    <h1 id="bbgTitle"></h1>
    <p class="hero-subtitle" id="bbgSubtitle"></p>
  </section>

  <!-- ==================== 战役背景视频（入场动画） ====================
       进入页面先播放战役背景视频（全屏覆盖，带声音）。
       视频开头 5 秒显示标题，之后渐隐，视频继续播放；
       右上角「跳过入场」按钮可随时跳过；视频完整播完后淡出，
       进入下方敌我情况/战役目标内容。
       ★ 接入方式：视频 src 由 JS 按 ?level= 从战役数据字典填充。
  =============================================================== -->
  <div class="bbg-intro-overlay" id="bbgIntroOverlay">
    <div class="bbg-intro-video">
      <!-- 不写死 <source>：视频源由下面的脚本按 ?level= 设置到 video.src 并 load()。
           写死 <source> + autoplay 会让浏览器在解析时就用它开始资源选择，
           之后再改 <source src> 是不生效的（见页面脚本里的说明）。 -->
      <video id="bbgIntroVid" autoplay playsinline></video>
    </div>
    <!-- 开场标题：视频开头显示，5 秒后渐隐 -->
    <div class="bbg-intro-content" id="bbgIntroContent">
      <span class="cut-eyebrow">CAMPAIGN BACKGROUND</span>
      <h1 id="bbgIntroTitle"></h1>
      <p id="bbgIntroSubtitle"></p>
    </div>
    <!-- 点击任意位置跳过入场 -->
  </div>

  <div class="bbg-shell">

    <!-- ==================== 敌我情况 ==================== -->
    <section class="bbg-section">
      <h2>敌我情况</h2>
      <div class="bbg-img-box">
        <!-- ★ 战役态势图（JS 按 ?level= 填充 src） -->
        <img id="battleSituation" src="" alt="战役态势图">
      </div>
      <div class="bbg-text" id="bbgForces"></div>
    </section>

    <!-- ==================== 战役目标 ==================== -->
    <section class="bbg-section">
      <h2>战役目标</h2>
      <div class="bbg-text" id="bbgObjective"></div>
    </section>

    <!-- ==================== 历史背景 ==================== -->
    <section class="bbg-section">
      <h2>历史背景</h2>
      <div class="bbg-text" id="battleContext"></div>
    </section>

    <!-- ==================== 开始战斗 ==================== -->
    <div class="bbg-start">
      <a class="battle-btn" id="startBattleBtn" href="./loading.html">&#9876; 开始指挥</a>
    </div>

  </div>

  <!-- 轻量富文本渲染：先转义再放行白名单标签（<br>/<strong>…），
       必须在下面的战役数据脚本之前同步加载，保证 window.richText 已就绪 -->
  <script src="/richText.js"></script>
  <script>
    /* =========================================================
       战役数据字典（参照 member.html / pagedata.js 的模式）：
       所有战役的背景内容集中在这里，新增战役只需加一条。
       页面框架和结构对所有战役都一样，只是文本和图片不同，
       通过 URL 参数 ?level=<id> 切换展示。
       ========================================================= */
    var CAMPAIGNS = {
      tashan_battle: {
        title: '塔山阻击战',
        subtitle: '1948年10月10日 — 10月15日 · 东北地区',
        video: 'http://179.255.122.44/videos/tashan.mp4',
        mapImg: './assets/texture/tashan_map.png',
        mapAlt: '塔山战役态势图',
        forcesHtml:
          '<strong>我方部队：</strong>东北野战军第四纵队，共八个师八万余人，在锦州西南塔山一带布下防线，进行防御作战<br><br>' +
          '<strong>敌方部队：</strong>国民党军侯镜如指挥的“东进兵团”（含第62军、第39军、第92军及独立第95师等11个师，共约十万人），增援锦州',
        objective: '坚守塔山主阵地，阻止国军增援锦州。在国军的海陆协同攻击下必须坚持五天（10min）直到四野主力攻克锦州',
        history: '此次国民党军进攻塔山，在蒋介石严令之下，各军、师长均能奋不顾身，亲临最前线指挥，海空军也频频出动配合，这在国民党军战史上是不多见的。然而，在人民解放军的顽强阻击下，始终不能越雷池一步，塔山阵地岿然不动。第四纵队在六昼夜的阻击作战中，给予国民党军队沉重打击，有力保障了攻锦作战的胜利，林彪、罗荣桓评价塔山阻击战是“模范的英勇顽强的防御战”，“对我当时攻击锦州，取得调整部署与攻击准备时间，起了决定的作用”。',
        loadingHref: './loading.html?level=tashan_battle'
      },
      subei_battle: {
        title: '宿北战役',
        subtitle: '1946年12月 · 江苏宿迁北部',
        video: 'http://179.255.122.44/videos/subei.mp4',
        mapImg: './assets/texture/subei_battle_map.jpg',
        mapAlt: '宿北战役态势图',
        forcesHtml:
          '<strong>我方部队：</strong>山东野战军与华中野战军，由陈毅、粟裕统一指挥，采取"集中兵力、各个歼灭"的作战方针，隐蔽集结、诱敌深入、抓住战机。<br><br>' +
          '<strong>敌方部队：</strong>国民党军整编第69师、整编第11师等部约2万余人，分路向宿迁以北地区进犯，企图打通陇海路东段，向华东解放区腹地推进。',
        objective: '集中优势兵力，抓住敌军分散冒进的战机，首先围歼整编第69师于宿北地区；打破国民党军对华东解放区的进攻，扭转华东战场的不利局面。',
        history: '1946年6月全面内战爆发后，国民党军向华东解放区发起大规模进攻。宿北战役是山东野战军与华中野战军首次协同作战，全歼国民党军整编第69师，毙其师长戴之奇，是华东战场战略防御阶段的重要转折。',
        loadingHref: './loading.html?level=subei_battle'
      },
      xian_battle: {
        title: '西安事变',
        subtitle: '1936年12月12日 · 西安华清池',
        video: 'http://179.255.122.44/videos/xian.mp4',
        mapImg: './assets/picture/xian.png',
        mapAlt: '介于两石',
        forcesHtml:
          '<strong>我方部队：</strong>东北军士兵登山搜寻<br><br>' +
          '<strong>敌方部队：</strong>蒋介石逃往后山',
        objective: '登上山顶，抓获蒋介石',
        history: ' 校长玩夜跑<br>学良全军满山找<br> 光头不得了<br>   最中正',
        loadingHref: './loading.html?level=xian_battle'
      }
    };

    /* ---------- 按 ?level= 填充页面内容（缺省用字典里的第一场战役） ---------- */
    (function () {
      var params = new URLSearchParams(window.location.search);
      var hashParams = new URLSearchParams(String(window.location.hash || '').replace(/^#/, ''));
      var stored = null;
      try { stored = window.sessionStorage.getItem('war-of-dots.campaign'); } catch (e) { stored = null; }

      // 关卡 id 三重兜底：?level= → #level= → sessionStorage。
      // 静态服务器的 cleanUrls 会把 "/battlebackground.html?level=x" 301 重写成
      // "/battlebackground"，**查询参数会被丢掉**（实测 npx serve 14.x）；
      // 只认 ?level= 的话这里就退回字典第一项 —— 表现就是"点宿北却显示塔山"。
      var requested = params.get('level') || hashParams.get('level') || stored || '';
      var level = CAMPAIGNS[requested] ? requested : null;
      // 注意：这里必须能兜住"没有 id 或 id 写错"的情况。
      // 之前兜底写的是 CAMPAIGNS.liaoshen，但字典里根本没有这个键 →
      // data 为 undefined → 下面第一行 data.title 抛 TypeError → 整段脚本中断，
      // 标题/态势图/文案/开始按钮/视频源全都不会设置（看起来就是"视频没换"）。
      var data = CAMPAIGNS[level] || CAMPAIGNS[Object.keys(CAMPAIGNS)[0]];
      if (!data) return;
      try { window.sessionStorage.setItem('war-of-dots.campaign', level); } catch (e) { /* 忽略 */ }

      document.title = '沙盘战争 — ' + data.title;
      document.getElementById('bbgTitle').textContent = data.title;
      document.getElementById('bbgSubtitle').textContent = data.subtitle;
      document.getElementById('bbgIntroTitle').textContent = data.title;
      document.getElementById('bbgIntroSubtitle').textContent = data.subtitle;
      // 显式说明"没找到你点的那一关"，不静默显示别的战役
      if (requested && !level) {
        document.getElementById('bbgSubtitle').textContent =
          data.subtitle + '（未找到战役「' + requested + '」，显示默认战役）';
      }

      var situation = document.getElementById('battleSituation');
      situation.src = data.mapImg;
      situation.alt = data.mapAlt;

      // 三个文本字段允许写少量富文本（<br> 换行、<strong> 加粗），统一走 richText()：
      // 之前 history 用 textContent 渲染，<br> 会被当成普通文字显示出来
      // （西安事变那条历史的 "…<br>…" 就是这么露出来的）。
      var render = window.richText || function (text) { return String(text == null ? '' : text); };
      document.getElementById('bbgForces').innerHTML = render(data.forcesHtml);
      document.getElementById('bbgObjective').innerHTML = render(data.objective);
      document.getElementById('battleContext').innerHTML = render(data.history);

      // 开始指挥 → 对应战役的加载页（同样带上 #level=，避免被静态服务器重写掉查询参数）
      var startBtn = document.getElementById('startBattleBtn');
      if (startBtn) {
        var loadingHref = data.loadingHref
          + (level ? (data.loadingHref.indexOf('#') < 0 ? '#level=' + encodeURIComponent(level) : '') : '');
        startBtn.setAttribute('href', loadingHref);
        startBtn.addEventListener('click', function (e) {
          e.preventDefault();
          window.location.href = loadingHref;
        });
      }

      // 视频源按战役切换：必须设到 <video> 自身并调用 load()。
      // 只改 <source src> 不生效——资源选择在 autoplay 开始时就完成了，
      // 之后改属性浏览器不会再评估（表现就是永远播默认那支视频）。
      var video = document.getElementById('bbgIntroVid');
      if (video && data.video) {
        video.src = data.video;
        video.load();
      }
    })();

    /* =========================================================
       战役背景入场视频：
       - play 后 5 秒 → 渐隐标题（视频继续）
       - ended → 淡出整个 overlay，滚到内容区
       - 右上角「跳过入场」→ 立即淡出
       - error（视频缺失/解码失败）→ 直接结束，不卡死
       ========================================================= */
    (function () {
      var overlay = document.getElementById('bbgIntroOverlay');
      var video = document.getElementById('bbgIntroVid');
      var content = document.getElementById('bbgIntroContent');
      if (!overlay) return;

      var finished = false;
      var titleHidden = false;
      function hideTitle() {
        if (titleHidden || !content) return;
        titleHidden = true;
        content.classList.add('fade-out');
      }
      function endIntro() {
        if (finished) return;
        finished = true;
        hideTitle();
        overlay.classList.add('fade-out');
        setTimeout(function () {
          if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
          var firstSection = document.querySelector('.bbg-shell .bbg-section');
          if (firstSection) firstSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 700);
      }

      // 点击 overlay 任意位置 → 跳过入场
      overlay.addEventListener('click', endIntro);

      if (video) {
        video.addEventListener('error', endIntro);
        video.addEventListener('play', function () {
          setTimeout(hideTitle, 5000);
        });
        var p = video.play();
        if (p && typeof p.catch === 'function') {
          p.catch(function () {
            video.muted = false;
            var p2 = video.play();
            if (p2 && typeof p2.catch === 'function') {
              p2.catch(endIntro);
            }
          });
        }
        video.addEventListener('ended', endIntro);
      } else {
        setTimeout(hideTitle, 5000);
        setTimeout(endIntro, 2600);
      }
    })();
  </script>

  <script src="/audio.js"></script>
  <script>
    // UI 音效：导航返回 / 开始指挥
    window.bindSfx({
      '.battle-nav a': 'click',
      '#startBattleBtn': 'button'
    });
  </script>
</body>
</html>
